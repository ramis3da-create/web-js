<!DOCTYPE html>


<head>
    <meta charset="UTF-8">
    <title>Clothes Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="main.js" defer></script> 
</head>
<body>


    <section id="cart"></section>
   
        <section class="Products">
                <h2 class="section-title">أحدث المنتجات</h2>
                <div class="Product">
        
                    <div class="box">
                        <div class="image-container">
                            <img src="./image/1.jpg" alt="جاكيت شتوي أنيق">
                            
                        </div>
                        <div class="product-info">
                            <h3>جاكيت شتوي أنيق</h3>
                            <div class="price-box">
                                <span id="total-amount" class="current-price">45.00</span>
                            </div>
                                <span class="old-price">60.00</span>
                                <button id="prace">Buy</button>
                            
                        </div>
                    </div>
        
                    <div class="box">
                        <div class="image-container">
                            <img src="./image/2.jpg" alt="قميص كاجوال رجالي">
                            
                        </div>
                        <div class="product-info">
                            <h3>قميص كاجوال رجالي</h3>
                            <div class="price-box">
                                <span class="current-price">25.00</span>
                            </div>
                                <span class="old-price">75.00</span>

                                <button id="prace">Buy</button>

                            
                        </div>
                    </div>
        
                    <div class="box">
                        <div class="image-container">
                            <img src="./image/3.jpg" alt="فستان سهرة نسائي">
                        </div>
                        <div class="product-info">
                            <h3>فستان سهرة نسائي</h3>
                            <div class="price-box">
                                <span class="current-price">55.00</span>
                            </div>
                                <span class="old-price">75.00</span>
                                <button id="prace">Bu</button>

                            
                        
                        </div>
                    </div></div>
        </section>
</body>


</html>
